<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeartSync – Find Your Match</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">

  <!-- ═══════════════════════════════ PROFILE SELECTOR ══════════════════════════════ -->
  <div id="selectorScreen" class="screen">
    <div class="selector-wrap">
      <header class="selector-header">
        <div class="logo-text">💕 HeartSync</div>
        <h1>Who are you today?</h1>
        <p>Select a profile to start browsing</p>
      </header>
      <div class="gender-tabs">
        <button class="gender-tab active" data-gender="ALL">All</button>
        <button class="gender-tab" data-gender="MALE">Men</button>
        <button class="gender-tab" data-gender="FEMALE">Women</button>
      </div>
      <div id="selectorGrid" class="selector-grid"></div>
    </div>
  </div>

  <!-- ══════════════════════════════════ MAIN APP ═══════════════════════════════════ -->
  <div id="mainApp" class="screen hidden">

    <!-- Mobile top bar -->
    <header class="topbar">
      <div class="logo-text small">💕 HeartSync</div>
      <button id="topbarSwitchBtn" class="topbar-avatar-btn" title="Switch profile">
        <img id="topbarAvatar" src="" alt="">
      </button>
    </header>

    <div class="app-body">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="logo-text">💕 HeartSync</div>

        <div class="user-chip">
          <img id="sidebarAvatar" src="" alt="">
          <div class="user-chip-info">
            <strong id="sidebarName"></strong>
            <small id="sidebarMeta"></small>
          </div>
          <button id="switchProfileBtn" class="icon-btn" title="Switch profile">⇄</button>
        </div>

        <nav id="sidebarNav">
          <button class="nav-btn active" data-view="browse">
            <span class="nav-icon">🔍</span>
            <span class="nav-label">Discover</span>
          </button>
          <button class="nav-btn" data-view="matches">
            <span class="nav-icon">💞</span>
            <span class="nav-label">Matches</span>
            <span class="badge hidden" id="matchBadge">0</span>
          </button>
          <button class="nav-btn" data-view="likes">
            <span class="nav-icon">⭐</span>
            <span class="nav-label">Liked Me</span>
            <span class="badge hidden" id="likeBadge">0</span>
          </button>
          <button class="nav-btn" data-view="profile">
            <span class="nav-icon">👤</span>
            <span class="nav-label">My Profile</span>
          </button>
        </nav>
      </aside>

      <!-- Content -->
      <main id="mainContent"></main>
    </div>

    <!-- Mobile bottom nav -->
    <nav class="bottom-nav">
      <button class="bnav-btn active" data-view="browse">🔍<span>Discover</span></button>
      <button class="bnav-btn" data-view="matches">💞<span>Matches</span></button>
      <button class="bnav-btn" data-view="likes">⭐<span>Liked Me</span></button>
      <button class="bnav-btn" data-view="profile">👤<span>Profile</span></button>
    </nav>
  </div>

  <!-- ════════════════════════════════ MATCH MODAL ══════════════════════════════════ -->
  <div id="matchModal" class="modal-overlay hidden">
    <div class="match-card">
      <div class="match-sparkle">✨</div>
      <h1 class="match-title">It's a Match!</h1>
      <p id="matchSubtext" class="match-sub"></p>
      <div class="match-photos">
        <img id="matchPhotoA" src="" alt="">
        <span class="match-heart">💕</span>
        <img id="matchPhotoB" src="" alt="">
      </div>
      <button id="matchContinueBtn" class="btn btn-primary full-w">Keep Discovering</button>
    </div>
  </div>

</div>
<script src="/js/app.js"></script>
</body>
</html>
